<!DOCTYPE html>
<html lang="en" th:class="${theme}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{nav.chatbot} + ' - SchemeAI'"></title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: 'var(--bg-primary)',
                        surface: 'var(--bg-surface)',
                        'surface-sec': 'var(--bg-surface-sec)',
                        border: 'var(--border-color)',
                        primary: 'var(--color-primary)',
                        'primary-hover': 'var(--color-primary-hover)',
                        success: 'var(--color-success)',
                        warning: 'var(--color-warning)',
                        error: 'var(--color-error)',
                        'text-main': 'var(--text-main)',
                        'text-muted': 'var(--text-muted)',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden bg-bg text-text-main">

    <!-- Top Header -->
    <header class="w-full bg-surface border-b border-border px-6 py-4 flex items-center justify-between z-10 shrink-0">
        <div class="flex items-center gap-6">
            <a href="dashboard.html" class="text-xl font-bold tracking-tight text-primary">SchemeAI</a>
            <nav class="hidden md:flex items-center gap-4 text-xs font-semibold uppercase tracking-wider">
                <a href="dashboard.html" class="text-primary border-b border-primary pb-1" th:text="#{nav.chatbot}">AI Chatbot</a>
                <a href="eligibility.html" class="text-text-muted hover:text-text-main transition" th:text="#{nav.eligibility}">Eligibility Checker</a>
                <a id="nav-admin-link" href="admin.html" class="hover:text-text-main transition hidden text-amber-500" th:text="#{nav.admin}">Admin Panel</a>
            </nav>
        </div>
        
        <div class="flex items-center gap-6">
            <!-- Language Switcher -->
            <div class="flex items-center gap-2 text-xs font-semibold">
                <a href="?lang=en" class="hover:text-primary transition" th:classappend="${#locale.language == 'en'} ? 'text-primary font-bold' : 'text-text-muted'">EN</a>
                <span class="text-border">|</span>
                <a href="?lang=hi" class="hover:text-primary transition" th:classappend="${#locale.language == 'hi'} ? 'text-primary font-bold' : 'text-text-muted'">हिंदी</a>
            </div>

            <!-- Theme Toggle -->
            <div>
                <a th:if="${theme == 'dark'}" href="/set-theme?theme=light" class="text-text-muted hover:text-text-main transition text-sm" title="Switch to Light Mode">☀️</a>
                <a th:if="${theme != 'dark'}" href="/set-theme?theme=dark" class="text-text-muted hover:text-text-main transition text-sm" title="Switch to Dark Mode">🌙</a>
            </div>

            <div class="flex items-center gap-4 text-sm">
                <span class="text-text-muted font-medium"><span th:text="#{nav.hello}">Hello</span>, <span id="nav-username" class="text-text-main font-semibold">User</span></span>
                <button onclick="logout()" class="bg-surface border border-border text-text-muted px-3 py-1.5 rounded-lg hover:bg-surface-sec hover:text-text-main transition text-xs font-semibold uppercase tracking-wider" th:text="#{nav.logout}">Log Out</button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden w-full max-w-7xl mx-auto">
        <!-- Left Sidebar: History -->
        <aside class="w-80 bg-surface border-r border-border p-4 flex flex-col gap-4 hidden lg:flex shrink-0">
            <div>
                <h3 class="text-xs text-text-main font-bold uppercase tracking-wider mb-2" th:text="#{dashboard.sidebar.title}">Chat History</h3>
                <p class="text-[10px] text-text-muted" th:text="#{dashboard.sidebar.desc}">Select any query below to reload the citations and text.</p>
            </div>
            <!-- Scrollable History List -->
            <div id="chat-history-list" class="flex-1 overflow-y-auto space-y-2.5 pr-1.5">
                <div class="flex items-center justify-center h-20 text-text-muted text-xs">Loading logs...</div>
            </div>
        </aside>

        <!-- Right Main View: Chat Window -->
        <main class="flex-1 flex flex-col justify-between overflow-hidden bg-bg/50">
            <!-- Messages scroll container -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-4">
                <!-- Appended message divs go here -->
            </div>

            <!-- Input bar footer -->
            <footer class="p-4 bg-surface border-t border-border shrink-0">
                <div class="max-w-4xl mx-auto mb-2.5 flex items-center justify-between gap-3">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-semibold text-text-muted flex items-center gap-1">
                            🎯 <span>Target Scheme Focus:</span>
                        </span>
                        <select id="chat-scheme-select" class="bg-surface-sec border border-border text-text-main text-xs font-medium rounded-lg px-3 py-1.5 focus:ring-1 focus:ring-primary outline-none transition">
                            <option value="">All Schemes (Auto-detect)</option>
                        </select>
                    </div>
                    <span id="selected-scheme-badge" class="hidden text-[11px] bg-primary/10 text-primary border border-primary/20 px-2.5 py-0.5 rounded-full font-medium"></span>
                </div>
                <form id="chat-form" class="max-w-4xl mx-auto flex gap-3">
                    <input type="text" id="chat-input" required autocomplete="off" class="flex-1 bg-surface border border-border rounded-lg px-4 py-3.5 text-text-main text-sm placeholder-text-muted focus:ring-1 focus:ring-primary" th:placeholder="#{dashboard.placeholder.chat}">
                    <button type="submit" class="bg-primary hover:bg-primary-hover text-white px-6 rounded-lg flex items-center justify-center font-semibold transition text-sm shadow-sm" th:text="#{dashboard.btn.send}">
                        Send Question
                    </button>
                </form>
            </footer>
        </main>
    </div>

    <!-- Hidden welcome message container for script translations -->
    <div id="welcome-message-translation" class="hidden" th:text="#{dashboard.welcome}"></div>
    <div id="sidebar-empty-translation" class="hidden" th:text="#{dashboard.sidebar.empty}"></div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
